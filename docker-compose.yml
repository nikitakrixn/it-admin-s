name: it-admin

services:
  # PostgreSQL. Порт наружу не публикуется: база доступна только сервисам.
  postgres:
    image: postgres:17-alpine
    container_name: itadmin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rust API. Наружу не публикуется — с ним общается только Nuxt-BFF.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itadmin-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      CORS_ALLOWED_ORIGINS: ${APP_ORIGIN}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Swagger UI в production выключен.
      DOCS_ENABLED: "false"
      AD_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Nuxt-сервер: отдаёт интерфейс и проксирует API (BFF).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itadmin-frontend
    restart: unless-stopped
    environment:
      NUXT_API_BASE_SERVER: http://backend:8000/api
      NUXT_PUBLIC_APP_ENV: production
      NUXT_PUBLIC_APP_NAME: IT-Admin
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # TLS-терминация и reverse proxy. Единственный сервис с внешними портами.
  caddy:
    image: caddy:2-alpine
    container_name: itadmin-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
