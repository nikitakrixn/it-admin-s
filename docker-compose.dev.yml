# Локальная разработка в Docker: база, бэкенд и фронтенд с горячей перезагрузкой.
# Запуск: docker compose -f docker-compose.dev.yml up
# Данные dev-базы лежат в томе postgres_dev_data и не пересекаются с production.

name: it-admin-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: itadmin-dev-postgres
    environment:
      POSTGRES_DB: itadmin
      POSTGRES_USER: itadmin
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itadmin -d itadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: itadmin-dev-backend
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_LOG_LEVEL: debug
      RUST_LOG: debug
      DATABASE_URL: postgres://itadmin:devpassword@postgres:5432/itadmin
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
      JWT_EXPIRATION: 86400
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: AdminPassword123!
      DOCS_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_cargo_cache:/usr/local/cargo/registry
      - backend_target:/app/target
    command: cargo watch -x run
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: itadmin-dev-frontend
    environment:
      NUXT_API_BASE_SERVER: http://backend:8000/api
      NUXT_PUBLIC_APP_ENV: development
      NUXT_PUBLIC_APP_NAME: IT-Admin
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    command: npm run frontend
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  backend_cargo_cache:
  backend_target:
